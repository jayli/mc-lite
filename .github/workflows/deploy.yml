# 自动部署到 GitHub Pages
# 每次 push 到 main 分支时触发

name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

  # 允许手动触发
  workflow_dispatch:

# 设置 GITHUB_TOKEN 权限
permissions:
  contents: read
  pages: write
  id-token: write

# 并发控制
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 构建阶段
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    # 这是一个纯静态前端项目，直接复制文件到部署目录
    - name: Prepare deployment
      run: |
        mkdir -p _site
        cp -r index.html src assets _site/ 2>/dev/null || true
        ls -la _site/

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  # 部署阶段
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
